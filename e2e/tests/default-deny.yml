---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  namespace: default
  name: macvlan1-default-deny
spec:
  config: '{
            "cniVersion": "0.3.1",
            "name": "macvlan1-default-deny",
            "plugins": [
                {
                    "type": "macvlan",
                    "mode": "bridge",
                    "ipam":{
                      "type":"host-local",
                      "subnet":"2.2.30.0/24",
                      "rangeStart":"2.2.30.8",
                      "rangeEnd":"2.2.30.67"
                    }
                }]
        }'
---
apiVersion: v1
kind: Namespace
metadata:
    name: test-default-deny
---
# pod-server listens on 5555 and 6666; no policy selects it until the test
# applies default-deny-policy.yml.
apiVersion: v1
kind: Pod
metadata:
  name: pod-server
  namespace: test-default-deny
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan1-default-deny
  labels:
    app: test-default-deny
    name: pod-server
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: netcat-tcp-5555
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
  - name: netcat-tcp-6666
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "6666"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client
  namespace: test-default-deny
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan1-default-deny
  labels:
    app: test-default-deny
    name: pod-client
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: macvlan-worker1
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
