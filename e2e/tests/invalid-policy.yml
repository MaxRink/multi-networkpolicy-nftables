---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  namespace: default
  name: macvlan1-invalid-policy
spec:
  config: '{
            "cniVersion": "0.3.1",
            "name": "macvlan1-invalid-policy",
            "plugins": [
                {
                    "type": "macvlan",
                    "mode": "bridge",
                    "ipam":{
                      "type":"host-local",
                      "subnet":"2.2.21.0/24",
                      "rangeStart":"2.2.21.8",
                      "rangeEnd":"2.2.21.67"
                    }
                }]
          }'
---
# namespace for MultiNetworkPolicy
apiVersion: v1
kind: Namespace
metadata:
    name: test-invalid-policy
---
# Pods
apiVersion: v1
kind: Pod
metadata:
  name: pod-server
  namespace: test-invalid-policy
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan1-invalid-policy
  labels:
    app: test-invalid-policy
    name: pod-server
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: macvlan-worker1
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-a
  namespace: test-invalid-policy
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan1-invalid-policy
  labels:
    app: test-invalid-policy
    name: pod-client-a
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: macvlan-worker1
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-b
  namespace: test-invalid-policy
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan1-invalid-policy
  labels:
    app: test-invalid-policy
    name: pod-client-b
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: macvlan-worker1
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
# MultiNetworkPolicies
# Valid policy: allows ingress to pod-server from pod-client-a only.
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: test-multinetwork-policy-invalid-valid-1
  namespace: test-invalid-policy
  annotations:
    k8s.v1.cni.cncf.io/policy-for: default/macvlan1-invalid-policy
spec:
  podSelector:
    matchLabels:
      name: pod-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: pod-client-a
---
# Invalid policy: references a non-existent NetworkAttachmentDefinition.
# The daemon must tolerate this gracefully without crashing or affecting
# the valid policy above.
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: test-multinetwork-policy-invalid-bad-1
  namespace: test-invalid-policy
  annotations:
    k8s.v1.cni.cncf.io/policy-for: default/non-existent-nad
spec:
  podSelector:
    matchLabels:
      name: pod-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: pod-client-b
