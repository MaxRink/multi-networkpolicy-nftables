---
apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  namespace: default
  name: macvlan1-conflicting-policies
spec:
  config: '{
            "cniVersion": "0.3.1",
            "name": "macvlan1-conflicting-policies",
            "plugins": [
                {
                    "type": "macvlan",
                    "mode": "bridge",
                    "ipam":{
                      "type":"host-local",
                      "subnet":"2.2.22.0/24",
                      "rangeStart":"2.2.22.8",
                      "rangeEnd":"2.2.22.67"
                    }
                }]
          }'
---
# namespace for MultiNetworkPolicy
apiVersion: v1
kind: Namespace
metadata:
    name: test-conflicting-policies
---
# Pods
# pod-server listens on both port 5555 and 6666 (one container each)
apiVersion: v1
kind: Pod
metadata:
  name: pod-server
  namespace: test-conflicting-policies
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan1-conflicting-policies
  labels:
    app: test-conflicting-policies
    name: pod-server
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: netcat-tcp-5555
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
  - name: netcat-tcp-6666
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "6666"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-a
  namespace: test-conflicting-policies
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan1-conflicting-policies
  labels:
    app: test-conflicting-policies
    name: pod-client-a
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: macvlan-worker1
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-b
  namespace: test-conflicting-policies
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan1-conflicting-policies
  labels:
    app: test-conflicting-policies
    name: pod-client-b
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: macvlan-worker1
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: pod-client-c
  namespace: test-conflicting-policies
  annotations:
    k8s.v1.cni.cncf.io/networks: default/macvlan1-conflicting-policies
  labels:
    app: test-conflicting-policies
    name: pod-client-c
spec:
  terminationGracePeriodSeconds: 0
  containers:
  - name: macvlan-worker1
    image: localhost:5000/multi-networkpolicy-nftables:e2e-test
    imagePullPolicy: Never
    command: ["nc", "-klp", "5555"]
    securityContext:
      privileged: true
---
# MultiNetworkPolicies
# Policy 1: allows ingress to pod-server from pod-client-a on port 5555 only.
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: test-multinetwork-policy-conflict-1
  namespace: test-conflicting-policies
  annotations:
    k8s.v1.cni.cncf.io/policy-for: default/macvlan1-conflicting-policies
spec:
  podSelector:
    matchLabels:
      name: pod-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: pod-client-a
    ports:
    - port: 5555
---
# Policy 2: allows ingress to pod-server from pod-client-b on port 6666 only.
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: test-multinetwork-policy-conflict-2
  namespace: test-conflicting-policies
  annotations:
    k8s.v1.cni.cncf.io/policy-for: default/macvlan1-conflicting-policies
spec:
  podSelector:
    matchLabels:
      name: pod-server
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          name: pod-client-b
    ports:
    - port: 6666
