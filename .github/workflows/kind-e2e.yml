name: e2e-kind
permissions:
  contents: read
on:
  push:
    branches:
      - main
      - master
      - nftables
  pull_request:
jobs:
  e2e-kind:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      - name: Install bats
        run: sudo apt install bats

      - name: Check out code into the Go module directory
        uses: actions/checkout@v4

      - name: Setup registry
        run: docker run -d --restart=always -p "5000:5000" --name "kind-registry" registry:2
  
      - name: Get tools
        working-directory: ./e2e
        run: ./get_tools.sh

      - name: Setup cluster
        working-directory: ./e2e
        run: ./setup_cluster.sh

      - name: "Test: simple"
        run: |
          export TERM=dumb
          make e2e

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: kind-logs-e2e
          path: ./e2e/artifacts/

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-test-results
          path: ./e2e/artifacts/junit/
          if-no-files-found: ignore

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        if: always() && hashFiles('./e2e/artifacts/junit/*.xml') != ''
        continue-on-error: true
        with:
          name: E2E Test Results
          path: ./e2e/artifacts/junit/*.xml
          reporter: java-junit
          token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false
          fail-on-empty: 'false'
