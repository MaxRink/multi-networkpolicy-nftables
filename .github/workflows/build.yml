on:
  push:
    branches:
      - main
      - master
      - nftables
  pull_request:
name: build
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        go-version: ["1.25.5"]
        goarch: [amd64, arm64]
    runs-on: ubuntu-latest
    env:
      GO111MODULE: on
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: '${{ matrix.go-version }}'

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Build
      run: make build GOARCH=${{ matrix.goarch }}
