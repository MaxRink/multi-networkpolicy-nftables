include:
- project: "cit/t-caas/ci/pipelines"
  ref: "${SHARED_PIPELINE_VERSION}"
  file:
  - 'execution/container/image.yaml'

variables:
  CONTAINER_IMAGE_DOCKERFILE: 'Dockerfile'
  CONTAINER_IMAGE_NAME: 'multi-networkpolicy-nftables'
  CONTAINER_IMAGE_CONTEXT: '${CI_PROJECT_DIR}'

image-push:
  tags:
  - aws_run_k8s_intel_m

# VM-based SR-IOV tc-flower e2e. GitLab runners with nested virtualization
# (KVM) can boot a real VM kernel, which — unlike a shared-kernel container —
# supports the netdevsim module (switchdev eswitch + VF representors) and can
# boot a patched kernel for offloaded-enforcement ("Layer D"). This exercises
# representor discovery, the real go-tc netlink driver, and software-datapath
# flower enforcement against a full kernel.
#
# Set VM_E2E_RUNNER_TAG to a KVM-capable runner tag to enable it (defaults to a
# placeholder so the job is inert until a tag is provided). allow_failure keeps
# it non-blocking while the KVM runner / patched-kernel image are being set up.
tc-flower-vm-e2e:
  stage: test
  image: golang:1.25
  tags:
  - ${VM_E2E_RUNNER_TAG}
  variables:
    VM_E2E_RUNNER_TAG: "kvm-unset"
  rules:
  - if: '$VM_E2E_RUNNER_TAG != "kvm-unset"'
    when: on_success
  - when: manual
    allow_failure: true
  before_script:
  - apt-get update -qq
  - apt-get install -y -qq qemu-system-x86 python3-pip iproute2 iputils-ping netcat-openbsd
  - pip3 install --break-system-packages virtme-ng || pip3 install virtme-ng
  script:
  - bash test/emulation/vm-run.sh
